#
# tools/ci.sh's steps on Debian 13, as the nodes have it: the header and format
# check; release builds on x86-64 and on arm64, as a Pi builds them; clang with
# its thread-safety analysis; ASan and UBSan on both, TSan; coverage to
# Codecov; and a build and test on macOS. Runs on the Pi build servers, and
# anything that starts containers or changes a host's network, stay by hand.
name: CI

# develop, main and pull requests only: a feature branch's gate runs on the
# Pi build servers. Notes and docs build nothing.
on:
  push:
    branches: [main, develop]
    paths-ignore: ['TODO/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['TODO/**', 'docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.step }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { step: check, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: clang, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: tsan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: tidy, arch: x86-64, runner: ubuntu-24.04 }
          - { step: events, arch: x86-64, runner: ubuntu-24.04 }
    container:
      image: debian:trixie
      # LeakSanitizer needs ptrace to stop the process's threads.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang clang-format clang-tidy libclang-rt-19-dev cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ${{ matrix.step }}
        run: tools/ci.sh ${{ matrix.step }}

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev lcov \
            curl gnupg  # Codecov's uploader verifies its own signature

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: tools/ci.sh coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: build-ci/coverage.info
          disable_search: true
          # A public repository's tokenless upload is refused.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # The image's default Xcode has a libc++ without std::jthread and
      # std::stop_token; the newest installed has them, as a current Mac does.
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Install packages
        run: brew install boost openssl@3 yaml-cpp googletest ninja

      - uses: actions/checkout@v4

      # Homebrew's own include directory, which Boost's path brings in, holds
      # OpenSSL 4 (the stack builds against 3, as Debian has it). A directory
      # with only OpenSSL 3's headers goes first, still read as system headers.
      # Dagda and Lugh are built on Linux only: neither has a macOS build of
      # its own yet.
      - name: Build
        run: |
          ssl="$(brew --prefix openssl@3)"
          mkdir -p build/ssl3-include
          ln -sfn "$ssl/include/openssl" build/ssl3-include/openssl
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOUHI_BUILD_TESTING=ON -DLOUHI_WARNINGS_AS_ERRORS=ON \
            -DLOUHI_DANNAN_REPOSITORY=https://github.com/tomdionysus/dannan.git -DLOUHI_BUILD_LUGH=OFF -DLOUHI_BUILD_DAGDA=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DOPENSSL_ROOT_DIR="$ssl" \
            -DCMAKE_CXX_FLAGS="-I$PWD/build/ssl3-include --system-header-prefix=openssl/"
          cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: build/louhi_tests
