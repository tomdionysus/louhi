# CodeQL security analysis of the library, built as in CI.
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # actions: read lets the analysis find its own run, which a private
    # repository does not grant by default.
    permissions:
      actions: read
      contents: read
      security-events: write
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates libboost-dev libssl-dev libyaml-cpp-dev

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOUHI_DANNAN_REPOSITORY=https://github.com/tomdionysus/dannan.git -DLOUHI_LUGH_REPOSITORY=https://github.com/tomdionysus/lugh.git -DLOUHI_DAGDA_REPOSITORY=https://github.com/tomdionysus/dagda.git -DLOUHI_LIR_REPOSITORY=https://github.com/tomdionysus/lir.git
          cmake --build build -j "$(nproc)"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
