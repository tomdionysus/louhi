# Louhi's own sources, uploaded by .github/workflows/ci.yml (tools/ci.sh coverage).
# Informational: coverage is reported, and does not fail a commit.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - louhi/test/
  - louhi/fuzz/
  - tools/
